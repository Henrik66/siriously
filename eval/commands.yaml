# Siriously eval commands (PRD §5.7). Format: see eval/cases.py. Ids refer to eval/fixtures/<fixture>.json.
# A `menu` pattern also accepts its shortcut as `keys` (File › New Note == cmd+n). Text compares
# case-insensitively, ignoring trailing . ! ? and curly quotes. `optional: true` steps may be skipped.
# Every `type` names its field (target): typed text must land there (explicitly or via focus).
# Template commands ("open X and <rest>", "start a <noun> called <name>") may be handled by the fast
# path without the model, so those cases accept [planner, fastpath]; the actions are still exact.

# ------------------------------------------------------------------ control (regex only, never the model)
# `before` turns run first in e2e mode, so there is something real to cancel / confirm / undo.
- id: ct-stop
  category: control
  fixture: notes
  utterance: stop
  expect: {route: control, control: stop, state: s-notes-0}

- id: ct-cancel
  category: control
  fixture: notes
  before: [quit notes]
  utterance: never mind
  note: cancels the pending "quit" confirmation; Notes must still be running
  expect: {route: control, control: cancel, app: Notes, state: s-notes-0}

- id: ct-undo
  category: control
  fixture: notes
  before: [new note]
  utterance: undo that
  expect: {route: control, control: undo, state: s-notes-0}

- id: ct-yes
  category: control
  fixture: slack
  before: [quit slack]
  utterance: "Yes."
  expect:
    route: control
    control: "yes"
    app: Finder
    e2e_actions: [[{op: menu, target: 104}]]

- id: ct-do-it
  category: control
  fixture: notes
  before: [quit notes]
  utterance: do it
  expect:
    route: control
    control: "yes"
    app: Finder
    e2e_actions: [[{op: menu, target: 104}]]

- id: ct-no
  category: control
  fixture: slack
  before: [quit slack]
  utterance: "no"
  expect: {route: control, control: "no", app: Slack, state: s-slack-0}

